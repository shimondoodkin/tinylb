[server]
bind = "0.0.0.0:8443"
tls_cert = "/etc/tinylb/certs/fullchain.pem"
tls_key  = "/etc/tinylb/certs/privkey.pem"

[health]
interval_secs = 10
timeout_secs = 3
unhealthy_cooldown_secs = 15

[[routes]]
host = "localhost"
[[routes.backends]]
url = "http://backend-a:80"
[[routes.backends]]
url = "http://backend-b:80"
