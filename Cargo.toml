[package]
name = "tinylb"
version = "0.1.0"
edition = "2021"
description = "Tiny, hot-reloadable HTTP + WebSocket reverse proxy with TLS, least-connections routing, and drain mode for zero-downtime deploys."
license = "MIT"
repository = "https://github.com/shimondoodkin/tinylb"
homepage = "https://github.com/shimondoodkin/tinylb"
keywords = ["load-balancer", "reverse-proxy", "websocket", "tls", "http"]
categories = ["network-programming", "web-programming::http-server"]
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
tungstenite = "0.24"
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
arc-swap = "1"
